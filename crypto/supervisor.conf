[supervisord]
nodaemon=true
logfile=/app/crypto/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Main WebSocket client + Shadow Trader
[program:shadow_trader]
command=python main.py --shadow-pool
directory=/app/crypto
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/app/crypto/logs/shadow_trader.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PYTHONPATH="/app:/app/crypto"

; Evolution scheduler (runs at 2 AM UTC daily)
[program:scheduler]
command=python scheduler.py --start --generations=10 --population=10
directory=/app/crypto
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/app/crypto/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONPATH="/app:/app/crypto"

; Strategy hot-reload watcher
[program:hot_reload]
command=python -m execution.shadow.hot_reload
directory=/app/crypto
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/app/crypto/logs/hot_reload.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
environment=PYTHONPATH="/app:/app/crypto"

; Group all processes for easy management
[group:crypto_alpha]
programs=shadow_trader,scheduler,hot_reload
priority=999
