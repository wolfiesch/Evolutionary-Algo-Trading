# fly.toml - Crypto Alpha Trading System
# Background worker deployed to Frankfurt (non-US)

app = 'crypto-alpha'
primary_region = 'fra'

[build]
  dockerfile = "../crypto/Dockerfile"
  context = ".."

[env]
  PYTHONUNBUFFERED = "1"

# Persistent storage for candle database
[mounts]
  source = "crypto_data"
  destination = "/data"

# Background worker - no HTTP service needed
# The app runs continuously processing WebSocket data

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
