# fly.toml - Crypto Alpha Trading System
# Background worker deployed to Frankfurt (non-US)

app = 'crypto-alpha'
primary_region = 'fra'

[build]
  dockerfile = "../crypto/Dockerfile"
  context = ".."

[env]
  PYTHONUNBUFFERED = "1"

# Persistent storage for candle database
[mounts]
  source = "crypto_data"
  destination = "/data"

# HTTP service for monitoring dashboard
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["http", "tls"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
