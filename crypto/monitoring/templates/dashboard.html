<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto-Alpha Monitoring Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background: #0a0e27;
            color: #e0e0e0;
            padding: 20px;
            font-size: 14px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #1e3a8a;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #60a5fa;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header .subtitle {
            color: #94a3b8;
            font-size: 12px;
        }

        .header .last-update {
            color: #64748b;
            font-size: 11px;
            margin-top: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #60a5fa;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-healthy {
            background: #065f46;
            color: #6ee7b7;
        }

        .status-degraded {
            background: #78350f;
            color: #fbbf24;
        }

        .status-down {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2d3748;
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #94a3b8;
            font-size: 12px;
        }

        .metric-value {
            color: #e0e0e0;
            font-weight: bold;
            font-size: 13px;
        }

        .metric-value.good {
            color: #6ee7b7;
        }

        .metric-value.warning {
            color: #fbbf24;
        }

        .metric-value.bad {
            color: #fca5a5;
        }

        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .symbol-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 10px;
        }

        .symbol-name {
            color: #60a5fa;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .symbol-stat {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #94a3b8;
            padding: 2px 0;
        }

        .strategy-list {
            margin-top: 10px;
        }

        .strategy-item {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .strategy-name {
            color: #60a5fa;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .strategy-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            font-size: 11px;
        }

        .strategy-stat {
            color: #94a3b8;
        }

        .strategy-stat span {
            color: #e0e0e0;
            font-weight: bold;
        }

        .signal-log {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 10px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 10px;
        }

        .signal-item {
            padding: 8px;
            margin-bottom: 8px;
            background: #1e293b;
            border-left: 3px solid #60a5fa;
            border-radius: 4px;
            font-size: 11px;
        }

        .signal-item.entry {
            border-left-color: #6ee7b7;
        }

        .signal-item.exit {
            border-left-color: #fca5a5;
        }

        .signal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: #60a5fa;
        }

        .signal-details {
            color: #94a3b8;
            font-size: 10px;
        }

        .loading {
            text-align: center;
            color: #64748b;
            padding: 40px;
        }

        .error {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }

        .wide-card {
            grid-column: 1 / -1;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 CRYPTO-ALPHA MONITORING</h1>
        <div class="subtitle">Real-time system status and performance metrics</div>
        <div class="last-update">Last updated: <span id="last-update">Loading...</span></div>
    </div>

    <div id="dashboard-content" class="loading">
        <div class="pulse">Loading dashboard data...</div>
    </div>

    <script>
        let lastData = null;

        async function fetchDashboardData() {
            try {
                const response = await fetch('/api/summary');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                lastData = data;
                renderDashboard(data);
                updateTimestamp();
            } catch (error) {
                console.error('Failed to fetch dashboard data:', error);
                showError(error.message);
            }
        }

        function renderDashboard(data) {
            const content = document.getElementById('dashboard-content');

            // System Health Card
            const healthCard = `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">System Health</div>
                        <div class="status-badge status-${data.health.status}">${data.health.status}</div>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Database</span>
                        <span class="metric-value ${data.health.db_accessible ? 'good' : 'bad'}">
                            ${data.health.db_accessible ? '✓ Connected' : '✗ Disconnected'}
                        </span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Last Candle Age</span>
                        <span class="metric-value ${data.health.last_candle_age_seconds < 300 ? 'good' : 'warning'}">
                            ${data.health.last_candle_age_seconds ? Math.floor(data.health.last_candle_age_seconds) + 's' : 'N/A'}
                        </span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Shadow Trader</span>
                        <span class="metric-value ${data.health.shadow_trader_running ? 'good' : 'warning'}">
                            ${data.health.shadow_trader_running ? '✓ Running' : '○ Idle'}
                        </span>
                    </div>
                </div>
            `;

            // Candle Stats Card
            const symbolsHtml = Object.entries(data.candles.symbols || {})
                .map(([symbol, stats]) => `
                    <div class="symbol-card">
                        <div class="symbol-name">${symbol}</div>
                        <div class="symbol-stat">
                            <span>Candles:</span>
                            <span>${stats.count.toLocaleString()}</span>
                        </div>
                        <div class="symbol-stat">
                            <span>Days:</span>
                            <span>${stats.days_of_data}</span>
                        </div>
                    </div>
                `).join('');

            const candleCard = `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Data Collection</div>
                        <div class="status-badge status-healthy">${data.candles.total_candles.toLocaleString()}</div>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Total Candles</span>
                        <span class="metric-value good">${data.candles.total_candles.toLocaleString()}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Collection Rate</span>
                        <span class="metric-value">${data.candles.collection_rate_per_hour.toLocaleString()}/hour</span>
                    </div>
                    <div class="symbol-grid">${symbolsHtml}</div>
                </div>
            `;

            // Evolution Card
            const bestStrat = data.evolution.best_strategy;
            const evolutionCard = `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Evolution Status</div>
                        <div class="status-badge status-${data.evolution.total_runs > 0 ? 'healthy' : 'degraded'}">
                            ${data.evolution.total_runs} runs
                        </div>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Total Runs</span>
                        <span class="metric-value">${data.evolution.total_runs}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Success Rate</span>
                        <span class="metric-value ${data.evolution.success_rate > 0.5 ? 'good' : 'warning'}">
                            ${(data.evolution.success_rate * 100).toFixed(0)}%
                        </span>
                    </div>
                    ${bestStrat ? `
                        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #334155;">
                            <div style="color: #60a5fa; font-size: 12px; margin-bottom: 8px;">Best Strategy</div>
                            <div class="metric-row">
                                <span class="metric-label">${bestStrat.name}</span>
                                <span class="metric-value good">Score: ${bestStrat.score ? bestStrat.score.toFixed(3) : 'N/A'}</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">Sharpe Ratio</span>
                                <span class="metric-value">${bestStrat.sharpe ? bestStrat.sharpe.toFixed(2) : 'N/A'}</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">Win Rate / Trades</span>
                                <span class="metric-value">${bestStrat.win_rate ? (bestStrat.win_rate * 100).toFixed(0) : 'N/A'}% / ${bestStrat.trade_count || 0}</span>
                            </div>
                        </div>
                    ` : '<div style="margin-top: 15px; color: #64748b; text-align: center;">No strategies evolved yet</div>'}
                </div>
            `;

            // Shadow Pool Card
            const strategiesHtml = (data.shadow_pool.strategies || [])
                .map(strat => `
                    <div class="strategy-item">
                        <div class="strategy-name">${strat.name}</div>
                        <div class="strategy-stats">
                            <div class="strategy-stat">Sharpe: <span>${strat.sharpe ? strat.sharpe.toFixed(2) : 'N/A'}</span></div>
                            <div class="strategy-stat">Win: <span>${strat.win_rate ? (strat.win_rate * 100).toFixed(0) : 'N/A'}%</span></div>
                            <div class="strategy-stat">Age: <span>${getAge(strat.deployed_at)}</span></div>
                        </div>
                    </div>
                `).join('');

            const shadowCard = `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Shadow Pool</div>
                        <div class="status-badge status-${data.shadow_pool.active_strategies > 0 ? 'healthy' : 'degraded'}">
                            ${data.shadow_pool.active_strategies} active
                        </div>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Active Strategies</span>
                        <span class="metric-value">${data.shadow_pool.active_strategies}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Signals Today</span>
                        <span class="metric-value">${data.shadow_pool.total_signals_today}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Open Positions</span>
                        <span class="metric-value ${data.shadow_pool.open_positions > 0 ? 'good' : ''}">${data.shadow_pool.open_positions}</span>
                    </div>
                    ${strategiesHtml ? `<div class="strategy-list">${strategiesHtml}</div>` : ''}
                </div>
            `;

            // Data Quality Card
            const qualityCard = `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Data Quality</div>
                        <div class="status-badge status-${data.data_quality.anomalies_24h === 0 ? 'healthy' : 'warning'}">
                            ${data.data_quality.anomalies_24h} issues
                        </div>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Volume Spikes</span>
                        <span class="metric-value ${data.data_quality.volume_spikes > 0 ? 'warning' : 'good'}">
                            ${data.data_quality.volume_spikes}
                        </span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Non-monotonic TS</span>
                        <span class="metric-value ${data.data_quality.non_monotonic_timestamps > 0 ? 'warning' : 'good'}">
                            ${data.data_quality.non_monotonic_timestamps}
                        </span>
                    </div>
                    ${data.data_quality.last_anomaly ? `
                        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #334155;">
                            <div style="color: #fbbf24; font-size: 11px; margin-bottom: 5px;">Last Anomaly</div>
                            <div style="color: #94a3b8; font-size: 10px;">${data.data_quality.last_anomaly.details}</div>
                        </div>
                    ` : ''}
                </div>
            `;

            // Recent Signals Card (wide)
            const signalsHtml = (data.recent_signals.signals || []).slice(0, 10)
                .map(signal => `
                    <div class="signal-item ${signal.signal.includes('entry') ? 'entry' : 'exit'}">
                        <div class="signal-header">
                            <span>${signal.symbol} - ${signal.signal}</span>
                            <span>${formatTime(signal.timestamp)}</span>
                        </div>
                        <div class="signal-details">
                            ${signal.strategy ? `Strategy: ${signal.strategy} | ` : ''}
                            Price: ${signal.price ? signal.price.toFixed(2) : 'N/A'}
                            ${signal.gene_expression ? ` | BTC: ${signal.gene_expression.btc_trend || 'N/A'}` : ''}
                        </div>
                    </div>
                `).join('');

            const signalsCard = `
                <div class="card wide-card">
                    <div class="card-header">
                        <div class="card-title">Recent Signals</div>
                        <div class="status-badge status-healthy">${data.recent_signals.total_signals_24h} today</div>
                    </div>
                    <div class="signal-log">
                        ${signalsHtml || '<div style="text-align: center; color: #64748b; padding: 20px;">No signals yet</div>'}
                    </div>
                </div>
            `;

            content.innerHTML = `
                <div class="grid">
                    ${healthCard}
                    ${candleCard}
                    ${evolutionCard}
                    ${shadowCard}
                    ${qualityCard}
                    ${signalsCard}
                </div>
            `;
            content.classList.remove('loading');
        }

        function showError(message) {
            const content = document.getElementById('dashboard-content');
            content.innerHTML = `
                <div class="error">
                    <strong>Error loading dashboard:</strong> ${message}
                </div>
            `;
            content.classList.remove('loading');
        }

        function updateTimestamp() {
            const now = new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
            document.getElementById('last-update').textContent = now;
        }

        function formatTime(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(timestamp);
            return date.toISOString().substring(11, 19) + ' UTC';
        }

        function getAge(timestamp) {
            if (!timestamp) return 'N/A';
            const now = new Date();
            const then = new Date(timestamp);
            const hours = Math.floor((now - then) / 1000 / 3600);
            if (hours < 24) return `${hours}h`;
            const days = Math.floor(hours / 24);
            return `${days}d`;
        }

        // Initial fetch
        fetchDashboardData();

        // Auto-refresh every 10 seconds
        setInterval(fetchDashboardData, 10000);
    </script>
</body>
</html>
